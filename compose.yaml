# Local development only; never attach this database to a public network.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agro_operations
      POSTGRES_USER: agro_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro_dev -d agro_operations"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
